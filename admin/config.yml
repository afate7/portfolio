# ============================================================
# Decap CMS Configuration
# https://decapcms.org/docs/configuration-options/
# ============================================================

backend:
  name: git-gateway
  branch: main   # Branch to update (set to your default branch)

# Enable Netlify Identity widget for auth
publish_mode: editorial_workflow   # Adds Draft → Review → Published workflow

# Where media files are stored
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# ============================================================
# SITE URL — update this after you deploy to Netlify
# ============================================================
site_url: https://your-site.netlify.app   # ← change to your domain

# ============================================================
# COLLECTIONS
# ============================================================
collections:

  # ── BLOG POSTS ──────────────────────────────────────────
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date}}"
    preview_path: "blog/{{slug}}.html"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The post title shown in listings and the page heading"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""

      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Design", "Code", "Process", "Life", "Design Ethics"]
        default: "Design"

      - label: "Read Time (minutes)"
        name: "readTime"
        widget: "number"
        default: 5
        value_type: "int"
        min: 1
        max: 60

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "Short summary shown in blog listing (1–2 sentences)"

      - label: "Cover Emoji"
        name: "emoji"
        widget: "string"
        default: "✍️"
        hint: "Single emoji used as the post cover image"

      - label: "Cover Gradient"
        name: "gradient"
        widget: "string"
        default: "linear-gradient(135deg, #f0f4ff, #dde8ff)"
        hint: "CSS gradient for the cover background"

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Show this post as featured at the top of the blog"

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "Draft posts won't appear on the public site"

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Write your post here. Markdown and rich text supported."

  # ── PROJECTS ────────────────────────────────────────────
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["year", "title"]
    summary: "{{title}} ({{year}})"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Year"
        name: "year"
        widget: "number"
        default: 2025
        value_type: "int"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Product Design", value: "design" }
          - { label: "Full Stack", value: "fullstack" }
          - { label: "Frontend", value: "frontend" }
          - { label: "Open Source", value: "oss" }
          - { label: "Data Viz", value: "dataviz" }
          - { label: "Design System", value: "design" }
        default: "design"

      - label: "Category Label"
        name: "categoryLabel"
        widget: "string"
        hint: "e.g. Product Design, Full Stack, Open Source"

      - label: "Short Description"
        name: "description"
        widget: "text"
        hint: "2–3 sentences shown on the project card"

      - label: "Cover Emoji"
        name: "emoji"
        widget: "string"
        default: "🚀"

      - label: "Cover Gradient"
        name: "gradient"
        widget: "string"
        default: "linear-gradient(135deg, #f0f4ff, #dde8ff)"

      - label: "Tags"
        name: "tags"
        widget: "list"
        hint: "Tech stack / skills (e.g. React, Figma, Node.js)"

      - label: "Live URL"
        name: "liveUrl"
        widget: "string"
        required: false
        hint: "Link to the live project (optional)"

      - label: "GitHub URL"
        name: "githubUrl"
        widget: "string"
        required: false
        hint: "Link to the GitHub repo (optional)"

      - label: "Awards / Highlights"
        name: "highlights"
        widget: "list"
        required: false
        hint: "e.g. Webby Award 2024, 4.8 App Store rating"

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Show as a large featured card"

      - label: "Full Case Study"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Optional: full write-up of the project"

  # ── SITE SETTINGS ────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:

      - label: "Profile"
        name: "profile"
        file: "content/settings/profile.json"
        fields:
          - { label: "Name",          name: "name",          widget: "string" }
          - { label: "Title / Role",  name: "role",          widget: "string" }
          - { label: "Hero Headline", name: "heroHeadline",  widget: "string" }
          - { label: "Hero Subtext",  name: "heroSubtext",   widget: "text"   }
          - { label: "Email",         name: "email",         widget: "string" }
          - { label: "Twitter URL",   name: "twitter",       widget: "string", required: false }
          - { label: "GitHub URL",    name: "github",        widget: "string", required: false }
          - { label: "LinkedIn URL",  name: "linkedin",      widget: "string", required: false }
          - { label: "Available for work", name: "available", widget: "boolean", default: true }
          - { label: "Availability Label", name: "availabilityLabel", widget: "string", default: "Open to new projects" }

      - label: "About Section"
        name: "about"
        file: "content/settings/about.json"
        fields:
          - { label: "Heading",    name: "heading",    widget: "string" }
          - { label: "Paragraph 1", name: "para1",    widget: "text"   }
          - { label: "Paragraph 2", name: "para2",    widget: "text"   }
          - { label: "Paragraph 3", name: "para3",    widget: "text"   }
          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Skills"
            name: "skills"
            widget: "list"
            hint: "Tech stack and skills shown as tags"
