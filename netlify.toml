# ============================================================
# Netlify Configuration
# ============================================================

[build]
  publish = "."      # Serve from root (no build step needed)
  command = ""       # No build command — pure static files

# ── Headers ─────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    X-XSS-Protection        = "1; mode=block"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — shorter cache so updates propagate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Content (Markdown/JSON) — short cache for CMS updates
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

# ── Redirects ────────────────────────────────────────────────
# Clean URLs: /blog → /blog/index.html
[[redirects]]
  from   = "/blog"
  to     = "/blog/index.html"
  status = 200

[[redirects]]
  from   = "/projects"
  to     = "/projects/index.html"
  status = 200

# 404 fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

# ── Netlify Identity (for CMS auth) ─────────────────────────
[context.production.environment]
  NODE_VERSION = "18"
